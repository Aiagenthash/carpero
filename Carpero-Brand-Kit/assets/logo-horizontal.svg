<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 90" width="100%" height="100%">
  <defs>
    <linearGradient id="em-h" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cy-h" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="h-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left Icon Mark: Interlocking Dual-Loop Ribbon -->
  <g transform="translate(14, 10)">
    <!-- Soft Glow -->
    <circle cx="36" cy="35" r="32" fill="#00F59B" opacity="0.12" filter="url(#h-glow)" />

    <!-- Outer Emerald Loop -->
    <path d="M 40 14 C 24 12 14 23 14 36 C 14 49 24 59 41 58 C 51 56 57 49 55 39 C 53 29 44 27 36 31 C 28 35 28 43 33 48" 
          fill="none" stroke="url(#em-h)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Cyan Loop Intertwined -->
    <path d="M 33 58 C 49 60 59 49 59 36 C 59 23 49 13 32 14 C 22 16 16 23 18 33 C 20 43 29 45 37 41 C 45 37 45 29 40 24" 
          fill="none" stroke="url(#cy-h)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Intersection Point -->
    <circle cx="36" cy="36" r="2" fill="#FFFFFF" />
  </g>

  <!-- Right Typography: Exact Sans-serif Lockup -->
  <g transform="translate(104, 16)">
    <text x="0" y="38" 
          font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="36" 
          font-weight="800" 
          letter-spacing="5.5" 
          fill="#FFFFFF">CARPERO</text>
    <text x="2" y="55" 
          font-family="system-ui, -apple-system, 'Inter', sans-serif" 
          font-size="8.5" 
          font-weight="700" 
          letter-spacing="3" 
          fill="#00F59B" 
          opacity="0.95">AUTONOMOUS REVENUE RECOVERY</text>
  </g>
</svg>
