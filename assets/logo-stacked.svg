<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="em-stack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="cy-stack" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <radialGradient id="stack-bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0F1726" />
      <stop offset="65%" stop-color="#07090E" />
      <stop offset="100%" stop-color="#05060A" />
    </radialGradient>
    <filter id="stack-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Canvas -->
  <rect width="500" height="500" rx="36" fill="url(#stack-bg)" />

  <!-- Center Ambient Light -->
  <circle cx="250" cy="205" r="140" fill="#00F59B" opacity="0.08" filter="url(#stack-glow)" />
  <circle cx="250" cy="205" r="110" fill="#00D2FF" opacity="0.06" filter="url(#stack-glow)" />

  <!-- The Interlocking Mobius Ribbon C -->
  <g transform="translate(135, 90)">
    <!-- Outer Emerald Ribbon -->
    <path d="M 125 45 C 75 40 45 72 45 115 C 45 158 75 190 128 185 C 160 180 180 158 175 125 C 170 92 142 86 116 98 C 90 110 88 135 106 152" 
          fill="none" stroke="url(#em-stack)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Inner Cyan Ribbon Intertwined -->
    <path d="M 105 185 C 155 190 185 158 185 115 C 185 72 155 40 102 45 C 70 50 50 72 55 105 C 60 138 88 144 114 132 C 140 120 142 95 124 78" 
          fill="none" stroke="url(#cy-stack)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Center Point of Convergence -->
    <circle cx="115" cy="115" r="6" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Wordmark: CARPERO -->
  <text x="250" y="380" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-size="46" 
        font-weight="800" 
        letter-spacing="9" 
        fill="#FFFFFF">CARPERO</text>

  <!-- Subtitle Tagline -->
  <text x="250" y="415" 
        text-anchor="middle"
        font-family="system-ui, -apple-system, 'Inter', sans-serif" 
        font-size="12" 
        font-weight="700" 
        letter-spacing="4" 
        fill="#00F59B" 
        opacity="0.9">AUTONOMOUS REVENUE RECOVERY</text>
</svg>
